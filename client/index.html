    <script>
      try {
        const storedTheme = localStorage.getItem("theme-preference") || localStorage.getItem("theme") || "dark";
        const resolvedTheme = storedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : storedTheme;
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.dataset.themePreference = storedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          resolvedTheme === "dark" ? "#030b1e" : "#f4f8fc",
        );
      } catch {
        document.documentElement.classList.add("dark");
      }
      const publicPath = window.location.pathname;
      const publicUrl = new URL(publicPath, window.location.origin).href;
      const canonicalLink = document.querySelector('link[data-canonical-url="true"]');
      if (canonicalLink) canonicalLink.setAttribute("href", publicUrl);
      const ogUrl = document.querySelector('#og-url');
      if (ogUrl) ogUrl.setAttribute("content", publicUrl);
      const baseUrl = "%BASE_URL%";
      const routePath = window.location.pathname.replace(baseUrl.replace(/\/$/, ""), "") || "/";
      if (/^\/(favoritos|curadoria)(\/|$)/.test(routePath)) {
        document.querySelector('#robots-meta')?.setAttribute("content", "noindex, nofollow");
      }
    </script>
    <script>
      (function () {
        var rescueVersion = "v10";
        var rescueMode = "network-only";
        var baseUrl = "%BASE_URL%";
        var rescueParam = "pg_boot_rescue";
        var staleRuntimePattern = /(failed to fetch dynamically imported module|error loading dynamically imported module|importing a module script failed|failed to load module script|chunkloaderror|loading chunk .+ failed|unable to preload css)/i;
        var rescueStarted = false;
        var currentUrl = new URL(window.location.href);
        var previousRescue = currentUrl.searchParams.get(rescueParam);
        var scopeUrl = new URL(baseUrl, window.location.href).href;
        var hadController = "serviceWorker" in navigator && !!navigator.serviceWorker.controller;

        if (previousRescue) {
          currentUrl.searchParams.delete(rescueParam);
          window.history.replaceState(window.history.state, "", currentUrl.toString());
        }

        function getMessage(value) {
          if (typeof value === "string") return value;
          if (value && typeof value === "object" && "message" in value) return String(value.message || "");
          return "";
        }

        function clearPortfolioCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys()
            .then(function (keys) {
              return Promise.all(
                keys
                  .filter(function (key) { return key.indexOf("pg-portfolio-pwa-") === 0; })
                  .map(function (key) { return caches.delete(key); }),
              );
            })
            .catch(function () {
              return undefined;
            });
        }

        function retirePortfolioWorkers() {
          if (!("serviceWorker" in navigator)) return Promise.resolve();
          return navigator.serviceWorker.getRegistrations()
            .then(function (registrations) {
              return Promise.all(
                registrations
                  .filter(function (registration) {
                    return registration.scope === scopeUrl;
                  })
                  .map(function (registration) {
                    try {
                      if (registration.active) {
                        registration.active.postMessage({ type: "PG_RETIRE_RUNTIME", version: rescueVersion });
                      }
                    } catch (_) {
                      // The old worker may already be stopping.
                    }
                    return registration.unregister().catch(function () { return false; });
                  }),
              );
            })
            .catch(function () {
              return undefined;
            });
        }

        function navigateFresh(reason) {
          var nextUrl = new URL(window.location.href);
          nextUrl.searchParams.set(
            rescueParam,
            rescueVersion + "-" + reason + "-" + Date.now().toString(36),
          );
          window.location.replace(nextUrl.toString());
        }

        function rescueRuntime(reason) {
          if (rescueStarted || navigator.onLine === false) return Promise.resolve(false);
          rescueStarted = true;

          return Promise.all([clearPortfolioCaches(), retirePortfolioWorkers()])
            .then(function () {
              navigateFresh(reason);
              return true;
            })
            .catch(function () {
              navigateFresh(reason);
              return true;
            });
        }

        Promise.all([clearPortfolioCaches(), retirePortfolioWorkers()])
          .then(function () {
            if (
              hadController &&
              !(previousRescue && previousRescue.indexOf(rescueVersion) === 0)
            ) {
              return rescueRuntime("controlled-client");
            }
            return false;
          })
          .catch(function () {
            return undefined;
          });

        window.addEventListener(
          "error",
          function (event) {
            if (staleRuntimePattern.test(getMessage(event.error) || event.message || "")) {
              void rescueRuntime("window-error");
            }
          },
          true,
        );

        window.addEventListener("unhandledrejection", function (event) {
          if (staleRuntimePattern.test(getMessage(event.reason))) {
            void rescueRuntime("promise-rejection");
          }
        });

        window.addEventListener("DOMContentLoaded", function () {
          var root = document.getElementById("root");
          if (!root || typeof MutationObserver === "undefined") return;

          function inspectLegacyBoundary() {
            var text = root.textContent || "";
            if (
              text.indexOf("Algo saiu do percurso.") >= 0 &&
              (text.indexOf("Tentar novamente") >= 0 || text.indexOf("ERRO 500") >= 0)
            ) {
              void rescueRuntime("legacy-boundary");
            }
          }

          var observer = new MutationObserver(inspectLegacyBoundary);
          observer.observe(root, { childList: true, subtree: true, characterData: true });
          inspectLegacyBoundary();
          window.setTimeout(function () { observer.disconnect(); }, 20000);
        });

        window.__pgRuntimeRescue = {
          version: rescueVersion,
          mode: rescueMode,
          scope: scopeUrl,
          rescue: rescueRuntime,
        };
      })();
    </script>
