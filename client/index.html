    <script>
      try {
        const storedTheme = localStorage.getItem("theme-preference") || localStorage.getItem("theme") || "dark";
        const resolvedTheme = storedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : storedTheme;
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.dataset.themePreference = storedTheme;
      } catch {
        document.documentElement.classList.add("dark");
      }
      const publicPath = window.location.pathname === "/" ? "/" : window.location.pathname;
      const publicUrl = new URL(publicPath, window.location.origin).href;
      const canonicalLink = document.querySelector('link[data-canonical-url="true"]');
      if (canonicalLink) canonicalLink.setAttribute("href", publicUrl);
      const ogUrl = document.querySelector('#og-url');
      if (ogUrl) ogUrl.setAttribute("content", publicUrl);
      const socialImageUrl = new URL("/manus-storage/pablo-hero-archive_fbc55c04.png", window.location.origin).href;
      document.querySelector('#og-image')?.setAttribute("content", socialImageUrl);
      document.querySelector('#twitter-image')?.setAttribute("content", socialImageUrl);
      if (/^\/(favoritos|curadoria)(\/|$)/.test(window.location.pathname)) {
        document.querySelector('#robots-meta')?.setAttribute("content", "noindex, nofollow");
      }
    </script>

      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = `${endpoint.replace(/\\/$/, "")}/umami`;
        analytics.dataset.websiteId = websiteId;
        document.body.appendChild(analytics);
