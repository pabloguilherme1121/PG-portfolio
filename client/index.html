    <meta property="og:url" content="https://pabloguilherme1121.github.io/PG-portfolio/" id="og-url" />
    <meta property="og:site_name" content="Arquivo Profundo — Pablo Guilherme" />
    <meta property="og:title" content="Pablo Guilherme — tecnologia, conteúdo e repertório visual" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Pablo Guilherme — tecnologia, conteúdo e repertório visual" />

    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Pablo Guilherme — Tecnologia, Conteúdo e Repertório Visual</title>
    <script>
      try {
        const storedTheme = localStorage.getItem("theme-preference") || localStorage.getItem("theme") || "dark";
        const resolvedTheme = storedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : storedTheme;
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.dataset.themePreference = storedTheme;
      } catch {
        document.documentElement.classList.add("dark");
      }
      const publicPath = window.location.pathname;
      const publicUrl = new URL(publicPath, window.location.origin).href;
      const canonicalLink = document.querySelector('link[data-canonical-url="true"]');
      if (canonicalLink) canonicalLink.setAttribute("href", publicUrl);
      const ogUrl = document.querySelector('#og-url');
      if (ogUrl) ogUrl.setAttribute("content", publicUrl);
      const socialImageUrl = "https://avatars.githubusercontent.com/u/311230121?v=4";
      document.querySelector('#og-image')?.setAttribute("content", socialImageUrl);
      document.querySelector('#twitter-image')?.setAttribute("content", socialImageUrl);
      const routePath = window.location.pathname.replace(import.meta.env.BASE_URL.replace(/\/$/, ""), "") || "/";
      if (/^\/(favoritos|curadoria)(\/|$)/.test(routePath)) {
        document.querySelector('#robots-meta')?.setAttribute("content", "noindex, nofollow");
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "name": "Pablo Guilherme",
        "url": "https://pabloguilherme1121.github.io/PG-portfolio/",
        "knowsLanguage": "pt-BR",
        "jobTitle": "Estudante de Análise e Desenvolvimento de Sistemas e criador audiovisual",
        "description": "Portfólio de Pablo Guilherme com projetos em desenvolvimento web, interfaces, conteúdo audiovisual, captação terrestre e imagens aéreas.",
        "sameAs": [
          "https://www.instagram.com/pablogui000/",
          "https://www.instagram.com/mpjstoryworks/"
        ],
        "knowsAbout": [
          "Interfaces e desenvolvimento web",
          "Criação e edição de conteúdo",
          "Filmagem com drone",
          "Captação audiovisual",
          "Direção e composição visual"
        ],
        "areaServed": [
          { "@type": "City", "name": "Águas Lindas de Goiás" },
          { "@type": "AdministrativeArea", "name": "Planaltina, Goiás e Distrito Federal" },
          { "@type": "AdministrativeArea", "name": "Entorno do Distrito Federal" }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const endpoint = import.meta.env.VITE_ANALYTICS_ENDPOINT;
      const websiteId = import.meta.env.VITE_ANALYTICS_WEBSITE_ID;
      if (endpoint && websiteId) {
        const analytics = document.createElement("script");
        analytics.defer = true;
        analytics.src = endpoint.replace(/\/$/, "") + "/umami";
        analytics.dataset.websiteId = websiteId;
        document.body.appendChild(analytics);
      }
    </script>
  </body>
</html>
