    <script>
      try {
        const storedTheme = localStorage.getItem("theme-preference") || localStorage.getItem("theme") || "dark";
        const resolvedTheme = storedTheme === "system"
          ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : storedTheme;
        document.documentElement.classList.toggle("dark", resolvedTheme === "dark");
        document.documentElement.dataset.themePreference = storedTheme;
        document.documentElement.style.colorScheme = resolvedTheme;
        document.querySelector('meta[name="theme-color"]')?.setAttribute(
          "content",
          resolvedTheme === "dark" ? "#030b1e" : "#f4f8fc",
        );
      } catch {
        document.documentElement.classList.add("dark");
      }
      const publicPath = window.location.pathname;
      const publicUrl = new URL(publicPath, window.location.origin).href;
      const canonicalLink = document.querySelector('link[data-canonical-url="true"]');
      if (canonicalLink) canonicalLink.setAttribute("href", publicUrl);
      const ogUrl = document.querySelector('#og-url');
      if (ogUrl) ogUrl.setAttribute("content", publicUrl);
      const baseUrl = "%BASE_URL%";
      const routePath = window.location.pathname.replace(baseUrl.replace(/\/$/, ""), "") || "/";
      if (/^\/(agenda|favoritos|curadoria)(\/|$)/.test(routePath)) {
        document.querySelector('#robots-meta')?.setAttribute("content", "noindex, nofollow");
      }
    </script>
    <script>
      (function () {
        var rescueVersion = "v10";
        var rescueMode = "network-only";
        var rescueParam = "pg_boot_rescue";
        var baseUrl = "%BASE_URL%";
        var scopeUrl = new URL(baseUrl, window.location.href).href;
        var cachePrefix = "pg-portfolio-pwa-";
        var staleRuntimePattern = /(failed to fetch dynamically imported module|error loading dynamically imported module|importing a module script failed|failed to load module script|chunkloaderror|loading chunk .+ failed|unable to preload css)/i;
        var recoveryStarted = false;
        var recoveryMarkerKey = "pg-portfolio-runtime-recovery-at";
        var recoveryCooldownMs = 45000;
        var recoveryUrl = new URL(window.location.href);
        var arrivedAfterRecovery =
          recoveryUrl.searchParams.has(rescueParam) ||
          recoveryUrl.searchParams.has("pg_recover");

        function clearLegacyRuntime() {
          var cacheCleanup = "caches" in window
            ? caches.keys()
                .then(function (keys) {
                  return Promise.all(
                    keys
                      .filter(function (key) { return key.indexOf(cachePrefix) === 0; })
                      .map(function (key) { return caches.delete(key); }),
                  );
                })
                .catch(function () { return undefined; })
            : Promise.resolve();

          var workerCleanup = "serviceWorker" in navigator
            ? navigator.serviceWorker.getRegistrations()
                .then(function (registrations) {
                  return Promise.all(
                    registrations
                      .filter(function (registration) { return registration.scope === scopeUrl; })
                      .map(function (registration) { return registration.unregister(); }),
                  );
                })
                .catch(function () { return undefined; })
            : Promise.resolve();

          return Promise.all([cacheCleanup, workerCleanup]);
        }

        function showLoadFailure() {
          var fallback = document.getElementById("portfolio-startup-fallback");
          if (fallback) fallback.hidden = false;
        }

        function reserveRecovery() {
          if (recoveryStarted || arrivedAfterRecovery || navigator.onLine === false) {
            return false;
          }

          var now = Date.now();
          try {
            var previous = Number(window.sessionStorage.getItem(recoveryMarkerKey) || 0);
            if (previous > 0 && now - previous < recoveryCooldownMs) return false;
            window.sessionStorage.setItem(recoveryMarkerKey, String(now));
          } catch (_) {
            // URL markers still stop retries when session storage is unavailable.
          }

          recoveryStarted = true;
          return true;
        }

        function recoverOnce(reason) {
          if (!reserveRecovery()) {
            showLoadFailure();
            return Promise.resolve(false);
          }

          return clearLegacyRuntime()
            .then(function () {
              var nextUrl = new URL(window.location.href);
              nextUrl.searchParams.set(rescueParam, rescueVersion + "-" + reason);
              window.location.replace(nextUrl.toString());
              return true;
            })
            .catch(function () {
              var nextUrl = new URL(window.location.href);
              nextUrl.searchParams.set(rescueParam, rescueVersion + "-" + reason);
              window.location.replace(nextUrl.toString());
              return true;
            });
        }

        clearLegacyRuntime();

        window.addEventListener("error", function (event) {
          var target = event.target;
          var entryFailed =
            target &&
            target.tagName === "SCRIPT" &&
            target.type === "module" &&
            target.src;
          var message =
            (event.error && event.error.message) ||
            event.message ||
            "";
          if (entryFailed || staleRuntimePattern.test(String(message))) {
            void recoverOnce("window-error");
          }
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          var message =
            event.reason && event.reason.message
              ? event.reason.message
              : String(event.reason || "");
          if (staleRuntimePattern.test(message)) {
            void recoverOnce("promise-rejection");
          }
        });

        window.__pgRuntimeRescue = {
          version: rescueVersion,
          mode: rescueMode,
          reserveRecovery: reserveRecovery,
          rescue: recoverOnce,
        };
      })();
    </script>
