# Temporário: regenerar o lockfile com pnpm em runner oficial, sem executar scripts de pacotes.
# Escopo estrito: somente este branch e criação deste workflow.
name: One-time dependency lock refresh
on:
  push:
    branches:
      - fix/portfolio-security-audit-20261024
    paths:
      - .github/workflows/lockfile-refresh.yml

permissions:
  contents: write

concurrency:
  group: lock-refresh-20261024
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'pabloguilherme1121/PG-portfolio' && github.ref == 'refs/heads/fix/portfolio-security-audit-20261024'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@10.34.5 --activate
      - name: Resolve dependencies without package scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Upload updated lockfile to this branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile unchanged"; exit 0
          fi
          sha="$(gh api "/repos/$GITHUB_REPOSITORY/contents/pnpm-lock.yaml?ref=fix/portfolio-security-audit-20261024" --jq '.sha')"
          gh api --method PUT "/repos/$GITHUB_REPOSITORY/contents/pnpm-lock.yaml" \
            -f branch=fix/portfolio-security-audit-20261024 \
            -f message='chore(deps): lockfile regenerado com pnpm sem scripts' \
            -f sha="$sha" \
            --raw-field "content=$(base64 -w0 pnpm-lock.yaml)"
