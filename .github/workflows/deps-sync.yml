name: Sync dependency lockfile

on:
  push:
    branches: [fix/final-audit-hardening]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Regenerate lockfile
        run: pnpm install --no-frozen-lockfile
      - name: Verify dependency audit
        run: pnpm audit --audit-level=low
      - name: Commit synchronized lockfile
        run: |
          if git diff --quiet -- package.json pnpm-lock.yaml; then
            echo "Lockfile already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          git commit -m "chore: regenera lockfile após correções de segurança"
          git push origin HEAD:${GITHUB_REF_NAME}
