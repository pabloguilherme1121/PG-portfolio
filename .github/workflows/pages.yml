name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Check public media inventory
        run: pnpm audit:assets --strict-if-present
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Build static portfolio
        env:
          VITE_DEPLOY_TARGET: github-pages
          VITE_STATIC_DEPLOY: "true"
        run: pnpm exec vite build
      - name: Prepare Pages artifact
        run: node scripts/prepare-github-pages.mjs
      - name: Validate public routes
        run: node scripts/validate-pages-bundle.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Browser tests
        env:
          E2E_BASE_URL: "http://127.0.0.1:4173"
          E2E_SERVE_PAGES: "true"
          E2E_STATIC_DEPLOY: "true"
        run: pnpm test:e2e
      - name: Share validated build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pages-build
          path: dist/public
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v4
        with:
          name: pages-build
          path: dist/public
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
