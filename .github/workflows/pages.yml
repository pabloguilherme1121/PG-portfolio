name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install public app and build tools only
        run: pnpm --filter . --filter @pg/portfolio... install --frozen-lockfile
      - name: Typecheck public app without API packages
        run: pnpm check:portfolio
      - name: Build public app without API packages
        run: pnpm build:static
      - name: Verify API dependencies are isolated
        run: node scripts/verify-static-isolation.mjs

  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Official Playwright image already has the browsers and their system dependencies.
    # Must match the @playwright/test version pinned in pnpm-lock.yaml (1.62.1).
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001 --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack in unprivileged directory
        run: |
          mkdir -p "$HOME/.local/bin"
          corepack enable --install-directory "$HOME/.local/bin" pnpm
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=low
      - name: Check public media inventory
        run: pnpm audit:assets --strict-if-present
      - name: Audit source escapes
        run: pnpm audit:source
      - name: Verify PG Tech hub Vercel security headers
        run: node --test scripts/check-pgtech-vercel-headers.test.mjs
      - name: Lint source
        run: pnpm lint
      - name: Typecheck public app
        run: pnpm check:portfolio
      - name: Verify standalone PG Shotlist package
        run: pnpm test:shotlist-deploy
      - name: Verify four standalone PG Lab packages
        run: pnpm test:pg-labs-deploy
      - name: Portfolio unit tests
        run: pnpm test:portfolio
      - name: Verify pinned Playwright browsers in test image
        run: |
          node --input-type=module -e '
            import { accessSync } from "node:fs";
            import { chromium, firefox, webkit } from "@playwright/test";
            import { createRequire } from "node:module";
            const require = createRequire(import.meta.url);
            const version = require("@playwright/test/package.json").version;
            if (version !== "1.62.1") throw new Error("Playwright version drift: " + version);
            for (const [name, browser] of Object.entries({ chromium, firefox, webkit })) {
              const binary = browser.executablePath();
              accessSync(binary);
              console.log(name + ": " + binary);
            }
          '
      - name: Build static portfolio
        run: pnpm build:static
      - name: Browser smoke on static bundle
        run: pnpm test:e2e:static
      - name: Repeat static mobile WebKit Arcade opening
        run: pnpm exec playwright test --config=playwright.static.config.ts --project=static-mobile-webkit --grep="bundle estático carrega PG Arcade" --repeat-each=5 --workers=1
      - name: Browser tests
        run: pnpm test:e2e
      - name: Repeat mobile WebKit Arcade regression
        run: pnpm exec playwright test --project=mobile-webkit --grep="PG Arcade mobile" --repeat-each=5 --workers=1
      - name: Enforce bundle budget
        env:
          VITE_STATIC_DEPLOY: "true"
        run: pnpm audit:bundle
      - name: Prepare Pages artifact
        run: node scripts/prepare-github-pages.mjs
      - name: Validate public routes
        run: node scripts/validate-pages-bundle.mjs
      - name: Share validated build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: dist/public
          if-no-files-found: error

      - name: Preserve browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-failure-diagnostics
          path: test-results
          if-no-files-found: ignore

  deploy:
    if: github.event_name != 'pull_request'
    needs: [quality, static-isolation]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist/public
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
