name: Deploy portfolio to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit dependencies
        run: pnpm audit --audit-level=high
      - name: Check public media inventory
        run: pnpm audit:assets --strict-if-present
      - name: Typecheck
        run: pnpm check
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        run: pnpm test:e2e
      - name: Build static portfolio
        env:
          VITE_DEPLOY_TARGET: github-pages
          VITE_STATIC_DEPLOY: "true"
        run: pnpm exec vite build
      - name: Enforce bundle budget
        env:
          VITE_STATIC_DEPLOY: "true"
        run: pnpm audit:bundle
      - name: Prepare Pages artifact
        run: node scripts/prepare-github-pages.mjs
      - name: Validate public routes
        run: node scripts/validate-pages-bundle.mjs
      - name: Share validated build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pages-build
          path: dist/public
          if-no-files-found: error

  deploy:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download validated build
        uses: actions/download-artifact@v8
        with:
          name: pages-build
          path: dist/public
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist/public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
